# Render Blueprint for the CareerOS API (New > Blueprint, pick this repo).
# The database lives on Neon; paste its URL into DATABASE_URL when prompted.
services:
  - type: web
    name: careeros-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    # plan omitted: Render's default for a new web service is the smallest always-on
    # instance (0.5c-512mb). Use plan: free only for throwaway tests; it sleeps when idle.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PROXY_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUTH_RATE_LIMIT
        value: 10/minute
      - key: WEB_CONCURRENCY
        value: "1"
      # Real jobs (free key: developer.adzuna.com). Empty = sample jobs only.
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      # AI resume review + Career Coach (console.anthropic.com). Empty = AI off.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "40"
      # Password reset by email code (resend.com). Empty = reset by email is off.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Google sign-in (console.cloud.google.com). Empty = button shows "coming soon".
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
