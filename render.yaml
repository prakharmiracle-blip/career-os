# Render Blueprint for the CareerOS API (New > Blueprint, pick this repo).
# The database lives on Neon; paste its URL into DATABASE_URL when prompted.
services:
  - type: web
    name: careeros-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PROXY_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AUTH_RATE_LIMIT
        value: 10/minute
      - key: WEB_CONCURRENCY
        value: "1"
